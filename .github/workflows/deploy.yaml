# Next.js static export -> ./out → FTP upload to Hostinger/shared hosting (public_html).
# Mirrors ver 2.0 with reproducible installs, Node 24, and verified output before FTP.

name: Deploy Vayla Website ver 3.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-vayla-io-ftp
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm run build
        env:
          NEXT_PUBLIC_BASE_URL: https://vayla.io
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}

      - name: Verify export output
        run: |
          test -f out/index.html || { echo "::error::Missing out/index.html"; exit 1; }
          test -d out/_next/static || { echo "::error::Missing Next static assets"; exit 1; }

      - name: Create .htaccess for routing
        run: |
          cat <<'EOF' > ./out/.htaccess
          RewriteEngine On
          RewriteBase /
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule ^([^/]+)/?$ $1.html [L]
          EOF

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ./public_html/
          delete: false
