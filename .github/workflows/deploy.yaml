# Next.js static export -> ./out -> FTP upload to public_html on shared hosting.
# This repository has one FTP deploy workflow; it does not use GitHub Pages.
# Do not add a second publisher for the same static export.

name: Deploy Vayla Website ver 3.0

on:
  workflow_dispatch:
  push:
    branches:
      # Next.js stack (pnpm, next build); main is legacy Vite — do not add until merged.
      - binance-redesign2

concurrency:
  group: deploy-vayla-io-ftp
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check lint
        run: pnpm run lint

      - name: Check types
        run: pnpm exec tsc --noEmit

      - name: Build static export
        run: pnpm run build
        env:
          NEXT_PUBLIC_BASE_URL: https://vayla.io

      - name: Verify export output
        run: |
          test -f out/index.html || { echo "::error::Missing out/index.html"; exit 1; }
          test -d out/_next/static || { echo "::error::Missing Next static assets"; exit 1; }
          test -f out/vayla_logo_icon_new.jpg || { echo "::error::Missing brand logo in export"; exit 1; }
          test -f out/vayla_logo_new.png || { echo "::error::Missing logo mark in export"; exit 1; }
          test -f out/favicon.ico || { echo "::error::Missing favicon.ico"; exit 1; }
          test -f out/favicon-48.png || { echo "::error::Missing favicon-48.png"; exit 1; }
          test -f out/robots.txt || { echo "::error::Missing robots.txt"; exit 1; }
          test -f out/sitemap.xml || { echo "::error::Missing sitemap.xml"; exit 1; }
          test -f out/llms.txt || { echo "::error::Missing llms.txt"; exit 1; }
          test -f out/site.webmanifest || { echo "::error::Missing site.webmanifest"; exit 1; }
          test -f out/arena/index.html || { echo "::error::Missing trailing-slash route out/arena/index.html"; exit 1; }
          test -f out/chart/index.html || { echo "::error::Missing trailing-slash route out/chart/index.html"; exit 1; }
          test -f out/tokenutility/index.html || { echo "::error::Missing trailing-slash route out/tokenutility/index.html"; exit 1; }
          test -f out/doc/index.html || { echo "::error::Missing trailing-slash route out/doc/index.html"; exit 1; }
          grep -q 'rel="icon"' out/index.html || { echo "::error::Missing favicon link in index.html"; exit 1; }

      - name: Create .htaccess for routing
        run: |
          cat <<'EOF' > ./out/.htaccess
          RewriteEngine On
          RewriteBase /
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule ^([^/]+)/?$ $1.html [L]
          EOF

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ./public_html/
          delete: false

      - name: Install dev-browser for production smoke test
        run: |
          npm install --global dev-browser
          dev-browser install

      - name: Verify production with dev-browser
        run: pnpm run check:production
