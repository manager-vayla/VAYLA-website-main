name: 🚀 Deploy Vayla Website ver 2.0

on:
  push:
    branches:
      - stitch-design

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # THÊM VÀO ĐÂY: Ép GitHub Actions sử dụng Node.js 24 cho các Javascript Actions
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          # CẬP NHẬT: Chuyển từ '20' lên '24' để tương thích với runner mới
          node-version: '24'

      - name: 📦 Install pnpm
        run: npm install -g pnpm

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🔨 Build Project
        run: pnpm run build
        env:
          NEXT_PUBLIC_BASE_URL: https://vayla.io

      - name: 📝 Create .htaccess for Routing
        run: |
          echo "RewriteEngine On
          RewriteBase /
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule ^([^/]+)/?$ \$1.html [L]" > ./out/.htaccess

      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ./public_html/
          delete: false
