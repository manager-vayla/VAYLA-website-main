name: 🚀 Deploy Vayla Website

on:
  push:
    branches:
      - feat/refactor-nextjs

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔨 Build Project
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_URL: https://vayla.io

      - name: 📝 Create .htaccess for Routing
        # Bước này cực kỳ quan trọng để các trang như /chart, /arena không bị lỗi 404
        run: |
          echo "RewriteEngine On
          RewriteBase /
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule ^([^/]+)/?$ \$1.html [L]" > ./out/.htaccess

      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          # CHỈNH SỬA TẠI ĐÂY:
          # Vì tài khoản FTP của bạn trỏ vào /home/ptbinh, ta phải đẩy vào public_html
          server-dir: ./public_html/
          # Nếu bạn muốn xóa các file cũ không còn tồn tại trong repo:
          delete: false
