<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E1A16"/>
      <stop offset="1" stop-color="#050706"/>
    </linearGradient>
    <linearGradient id="ball" x1="22" y1="22" x2="158" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B6FFE9"/>
      <stop offset="0.5" stop-color="#4DE6C0"/>
      <stop offset="1" stop-color="#1FB89A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#70F3D8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#70F3D8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hi" cx="35%" cy="30%" r="55%">
