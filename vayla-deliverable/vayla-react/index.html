    <!-- Schema.org structured data, boosts AEO/GEO across Google AI Overview,
         Perplexity, ChatGPT browsing, Claude web search, and traditional rich
         results. Combines Organization + WebSite + SoftwareApplication +
         FAQPage in one JSON-LD block. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://vayla.xyz/#organization",
          "name": "VAYLA",
          "legalName": "VAYLA Technology Inc",
          "url": "https://vayla.xyz/",
          "logo": "https://vayla.xyz/VAYLA_logo.png",
          "image": "https://vayla.xyz/og-image.svg",
          "description": "VAYLA is a non-custodial, on-chain protocol that turns fandom into ownership. Fans deposit into Creator Vaults that earn from streams, drops, sync licensing and merch.",
          "foundingDate": "2026",
          "sameAs": [
            "https://vayla.io/",
            "https://x.com/vaylamanager",
            "https://t.me/Vayla_Official",
            "https://github.com/manager-vayla",
            "https://www.coingecko.com/en/coins/vayla-2",
            "https://bscscan.com/token/0x3b6b2593475FC2Bf546F237Fd401D63a655cE53f",
            "https://manager-vayla.github.io/VAYLA-link-tree/"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://vayla.xyz/#website",
          "url": "https://vayla.xyz/",
          "name": "VAYLA",
          "description": "The settlement layer for fan-funded equity.",
          "publisher": { "@id": "https://vayla.xyz/#organization" },
          "inLanguage": "en-US",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://vayla.xyz/vaults?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "SoftwareApplication",
          "name": "VAYLA Protocol",
          "applicationCategory": "FinanceApplication",
          "operatingSystem": "Web (Ethereum, Base, Arbitrum)",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
          "description": "On-chain protocol for staking $VAYLA into creator vaults and earning pro-rata yield from creator revenue.",
          "url": "https://vayla.xyz/",
          "screenshot": "https://vayla.xyz/og-image.svg"
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is VAYLA?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "VAYLA is a non-custodial, on-chain protocol that lets fans deposit into Creator Vaults. The vault aggregates fan capital and receives every dollar the creator earns from streams, drops, sync licensing and merch. Yield streams pro-rata back to every fan staker, continuously."
              }
            },
            {
              "@type": "Question",
              "name": "How do I earn on VAYLA?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Connect a wallet, get $VAYLA tokens, pick a creator vault you believe in, and stake. As the creator earns revenue (streams, drops, sync, merch), yield streams to your position pro-rata to your share of the vault. Optional lockups give a boost multiplier of up to 1.5x."
              }
            },
            {
              "@type": "Question",
              "name": "Is VAYLA custodial?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. VAYLA is fully non-custodial. Funds sit in audited smart contracts on Ethereum, Base or Arbitrum. The VAYLA team cannot move user funds. Only the wallet holder can stake or withdraw."
              }
            },
            {
              "@type": "Question",
              "name": "What does VAYLA charge?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "VAYLA charges a 0% platform fee. Creators keep approximately 80% of revenue versus around 20% under traditional label deals. The protocol is funded by token economics, not extraction."
              }
            },
            {
              "@type": "Question",
              "name": "What chains does VAYLA support?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Ethereum mainnet, Base, and Arbitrum at launch. Smart contracts are audited by Spearbit and have an active Immunefi bug bounty."
              }
            }
          ]
        }
      ]
    }
    </script>
