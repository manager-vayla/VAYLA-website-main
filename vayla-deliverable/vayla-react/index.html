<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary -->
    <title>VAYLA — Web3 Music Fandom Platform</title>
    <meta name="description" content="VAYLA Arena Beta is a Web3 music fandom platform for creator support, voting, creation and participation-based rewards." />
    <meta name="keywords" content="VAYLA, VAYLA Arena, VAYLA Boost, VAYLA token, Web3 music, music fandom, On-chain V Chart, Create & Earn, BNB Smart Chain" />
    <meta name="author" content="VAYLA" />
    <link rel="canonical" href="https://vayla.io/" />

    <!-- Color theming -->
    <meta name="theme-color" content="#050706" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0E1A16" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark" />

    <!-- Crawlers -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-image-preview:large" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (Facebook, LinkedIn, Telegram, WhatsApp, Discord, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VAYLA" />
    <meta property="og:title" content="VAYLA — Web3 Music Fandom Platform" />
    <meta property="og:description" content="VAYLA Arena Beta is a Web3 music fandom platform for creator support, voting, creation and participation-based rewards." />
    <meta property="og:url" content="https://vayla.io/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://vayla.io/og-image.svg" />

    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="VAYLA Arena Beta: global music fandom, participation, voting and creation on BNB Smart Chain." />

    <meta name="twitter:title" content="VAYLA — Web3 Music Fandom Platform" />
    <meta name="twitter:description" content="VAYLA Arena Beta connects fans and creators through VAYLA Boost, voting, creation and participation-based rewards." />
    <meta name="twitter:image" content="https://vayla.io/og-image.svg" />
    <meta name="twitter:image:alt" content="VAYLA — Web3 music fandom platform." />

    <!-- Telegram-specific (also reads og:*; explicit name helps in some clients) -->
    <meta name="telegram:channel" content="@Vayla_Vaylian" />

    <!-- Geo / language hints -->
    <meta name="geo.region" content="US" />
    <meta name="language" content="English" />
